<svg xmlns="http://www.w3.org/2000/svg" width="980" height="802" viewBox="0 0 980 802" font-family="Roboto, Helvetica Neue, Helvetica, Arial, sans-serif" role="img" aria-labelledby="ui-hiw-title ui-hiw-desc"><title id="ui-hiw-title">How sprezzature-ui works</title><desc id="ui-hiw-desc">Flow diagram. At the top, your source tree feeds two lanes. The left lane audits: it walks the tree, finds sentences hardcoded in JavaScript, in HTML attributes and in Python prompt templates, and returns findings with exit code 1. The right lane makes: it scaffolds a single locales file, compiles it to JSON and emits the loader that reads it. Both meet in one outcome, an interface that can take a second language the day it is asked for.</desc><style>@media (prefers-color-scheme: dark){rect[fill="#FFFFFF"]{fill:#141416;}rect.paper{fill:#0B0B0C;}[fill="#1D1D1F"]{fill:#F2F2F7;}[fill="#6E6E73"]{fill:#9C9CA3;}[stroke="#1D1D1F"]{stroke:#F2F2F7;}[stroke="#C7C7CC"]{stroke:#5A5A5E;}[fill="#C7C7CC"]{fill:#5A5A5E;}rect[fill="#CCE4FF"]{fill:#082646;}rect[fill="#FFEACC"]{fill:#462C09;}}</style><rect class="paper" width="980" height="802" fill="#FFFFFF"/><text x="36" y="52" font-size="28" font-weight="700" fill="#1D1D1F">How sprezzature-ui works</text><text x="36" y="80" font-size="16" font-weight="400" fill="#6E6E73">The half of a front-end skill a function can own, and the half that stays prose.</text><rect x="36" y="104" width="908" height="68" rx="12" fill="#FFFFFF" stroke="#8E8E93" stroke-width="1.6" stroke-dasharray="6 5"/><text x="54" y="133" font-size="16" font-weight="600" fill="#1D1D1F">Your source tree</text><text x="54" y="157" font-size="13.5" font-weight="400" fill="#6E6E73">JavaScript, HTML templates, and the prompt strings buried in Python</text><path d="M490,172 V192 H254 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,204 L254,212 L258,204" fill="#C7C7CC"/><path d="M490,172 V192 H726 V204" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,204 L726,212 L730,204" fill="#C7C7CC"/><rect x="36" y="212" width="436" height="30" rx="12" fill="#CCE4FF"/><path d="M38,220 v14" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="64" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Audit: sentences that are not in the catalogue</text><rect x="36" y="258" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Walk the tree, drop what cannot be audited</text><text x="54" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">gather() is separate from audit_path() on purpose:</text><text x="54" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">a pre-commit hook already knows which files changed</text><text x="54" y="346" font-size="13.5" font-weight="400" fill="#6E6E73">and should not pay for a walk</text><path d="M254,360 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,376 L254,384 L258,376" fill="#C7C7CC"/><rect x="36" y="384" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><text x="54" y="413" font-size="16" font-weight="600" fill="#1D1D1F">Find the hardcoded strings</text><text x="54" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">a sentence in a JavaScript literal, in an HTML attribute,</text><text x="54" y="454" font-size="13.5" font-weight="400" fill="#6E6E73">in a prompt template. All three are language, and all three drift.</text><path d="M254,469 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M250,485 L254,493 L258,485" fill="#C7C7CC"/><rect x="36" y="510" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#007AFF" stroke-width="1.6"/><path d="M38,522 v61" stroke="#007AFF" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="540" font-size="16" font-weight="600" fill="#1D1D1F">Findings, with rule, path and line</text><text x="65" y="564" font-size="13.5" font-weight="400" fill="#6E6E73">exit 1 on any, which is what makes it worth a pre-commit</text><text x="65" y="581" font-size="13.5" font-weight="400" fill="#6E6E73">hook rather than a Friday afternoon</text><rect x="508" y="212" width="436" height="30" rx="12" fill="#FFEACC"/><path d="M510,220 v14" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="536" y="232" font-size="15" font-weight="700" fill="#1D1D1F">Make: the catalogue they belong in</text><rect x="508" y="258" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="286" font-size="16" font-weight="600" fill="#1D1D1F">Scaffold locales/i18n.yaml</text><text x="526" y="310" font-size="13.5" font-weight="400" fill="#6E6E73">interface strings and model prompts in one file, because</text><text x="526" y="328" font-size="13.5" font-weight="400" fill="#6E6E73">an interface and a prompt that disagree about a language is a bug</text><text x="526" y="346" font-size="13.5" font-weight="400" fill="#6E6E73">nobody reports</text><path d="M726,360 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,376 L726,384 L730,376" fill="#C7C7CC"/><rect x="508" y="384" width="436" height="102" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><text x="526" y="413" font-size="16" font-weight="600" fill="#1D1D1F">Compile it, and emit the loader</text><text x="526" y="437" font-size="13.5" font-weight="400" fill="#6E6E73">JSON for the browser, plus the module that reads it.</text><text x="526" y="454" font-size="13.5" font-weight="400" fill="#6E6E73">Deterministic, so the artifact is reproducible rather</text><text x="526" y="472" font-size="13.5" font-weight="400" fill="#6E6E73">than re-invented.</text><path d="M726,486 v17" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M722,502 L726,510 L730,502" fill="#C7C7CC"/><rect x="508" y="510" width="436" height="85" rx="12" fill="#FFFFFF" stroke="#FF9500" stroke-width="1.6"/><path d="M510,522 v61" stroke="#FF9500" stroke-width="5" stroke-linecap="round" fill="none"/><text x="537" y="540" font-size="16" font-weight="600" fill="#1D1D1F">One catalogue, two consumers</text><text x="537" y="564" font-size="13.5" font-weight="400" fill="#6E6E73">the screen and the prompts cannot drift apart, because they</text><text x="537" y="581" font-size="13.5" font-weight="400" fill="#6E6E73">are read from the same file</text><path d="M254,596 V616 H490 V630" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,630 L490,638 L494,630" fill="#C7C7CC"/><path d="M726,596 V616 H490 V630" stroke="#C7C7CC" stroke-width="1.6" fill="none"/><path d="M486,630 L490,638 L494,630" fill="#C7C7CC"/><rect x="36" y="638" width="908" height="102" rx="12" fill="#FFFFFF" stroke="#1D1D1F" stroke-width="1.6"/><path d="M38,650 v78" stroke="#1D1D1F" stroke-width="5" stroke-linecap="round" fill="none"/><text x="65" y="666" font-size="16" font-weight="600" fill="#1D1D1F">An interface that takes a second language the day it is asked for, instead of a week later</text><text x="65" y="690" font-size="13.5" font-weight="400" fill="#6E6E73">What an interface has to respect, the three-Roboto rule, the design tokens, the focus rings, the dark-mode peers, the reduced-motion</text><text x="65" y="708" font-size="13.5" font-weight="400" fill="#6E6E73">guards, is written in SKILL.md and stays a judgement. No HTTP route carries "make this dashboard legible", and this package does not</text><text x="65" y="726" font-size="13.5" font-weight="400" fill="#6E6E73">pretend otherwise.</text><text x="36" y="766" font-size="13.5" font-weight="400" fill="#6E6E73">This package is small and will stay small. Adding routes for the sake of the count would be mistaking breadth for value.</text></svg>
