[build-system]
requires = ["setuptools>=77", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sprezzature-ui"
version = "1.2.2"
description = "The deterministic half of sprezzature-ui: find the translations embedded in your JavaScript and the prompts inlined in your Python, and scaffold the catalogue they belong in."
readme = "README.md"
requires-python = ">=3.10"
license = "BSD-3-Clause"
license-files = ["LICENSE"]
authors = [{name = "Warith HARCHAOUI", email = "warithmetics@deraison.ai"}]
keywords = ["i18n", "localization", "tailwind", "vanilla-js", "frontend", "audit", "sprezzature"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Internationalization",
]

# click first. `sprezzature-ui` — the click front door — is a
# declared console script, and a command that `pip install` puts on PATH and
# that dies on `import click` is a defect this suite has shipped before. The
# audit itself is stdlib-only, which is what lets it sit in a pre-commit
# hook.
dependencies = [
    "click>=8.1",

    # ------------------------------------------------- une seule installation
    # Folded in from the extras on 2026-11-01. The base was 1
    # dependency, so `pip install sprezzature-ui` installed almost nothing and
    # did almost nothing: choosing the right extra was a thing a reader had to
    # know before the package could do its job. Across the suite that was 59
    # extras over eleven repositories, six of them with a base of one.
    #
    # The surfaces are not features and they are not optional any more: the
    # HTTP app and the MCP server are two of this package's five front doors,
    # and a door you have to install separately is a door people do not find.
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.0",
    "PyYAML>=6.0",
    "fastapi-mcp>=0.3",
    "mcp<2.0",
]

[project.optional-dependencies]
dev = [
    # The sibling linter, as a *dev* dependency. `tests/test_the_shipped_markup.py`
    # runs it over the markup this package ships — the starter page, the
    # component snippets — because this is the package whose job is to set the
    # example, and an exemplar that fails the suite's own lint is worth
    # nothing. It skipped when the linter was absent, which on a runner is
    # always: sixteen cases dormant in the one place they matter, reading as
    # sixteen passes. Pure Python, no runtime weight.
    "sprezzature-accessibility>=1.2.0",
    "pytest>=8.0", "ruff", "mypy", "httpx>=0.27", "PyYAML>=6.0",
    # tomllib landed in 3.11 and this package claims 3.10.
    'tomli>=2.0; python_version < "3.11"',
]

[project.scripts]
# One click front door under two names over the same table (the argparse
# front door was removed on 2026-10-25), plus one command per tool and the MCP
# server. All five are click since 2026-11-04.
make-ui = "sprezzature_ui.cli:main"
sprezzature-ui = "sprezzature_ui.cli:main"
sprezzature-ui-i18n-audit = "sprezzature_ui_scripts.audit_i18n:main"
sprezzature-ui-i18n-make = "sprezzature_ui_scripts.i18n_make:main"
sprezzature-ui-mcp = "sprezzature_ui.mcp:main"

[project.urls]
Homepage = "https://sprezzature.ai/"
Repository = "https://github.com/warith-harchaoui/sprezzature-ui"
Changelog = "https://github.com/warith-harchaoui/sprezzature-ui/blob/main/CHANGELOG.md"
Issues = "https://github.com/warith-harchaoui/sprezzature-ui/issues"

[tool.setuptools]
packages = ["sprezzature_ui", "sprezzature_ui_scripts"]

[tool.setuptools.package-dir]
"sprezzature_ui_scripts" = "scripts"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No `-q` here, on purpose. `-q` in `addopts` plus the `-q` a human types --
# or the one the pre-push hook passes -- is `-qq`, and at that verbosity pytest
# drops its last line: the run ends on the progress bar with no "N passed" at
# all. Four of the ten repositories were in that state, so `pytest -q` gave a
# verdict in six of them and a silence in four. Failures still printed, so
# nothing was ever wrong; a run that will not say what it did is still the
# wrong default for a suite whose whole argument is that a check must speak.
addopts = '-ra --strict-markers -m "not eval"'
markers = [
    # The i18n catalogue's prompt rules are a claim about model behaviour, so
    # the tests that support them call a model. They need Ollama running and a
    # qwen3-vl tag pulled, which a contributor's machine and a runner may not
    # have — hence opt-in, and hence the pre-push hook collecting them so a
    # syntax error in there surfaces in a second rather than in a month.
    "eval: LLM-output quality tests under tests/eval/ (need Ollama running)",
    "network: tests that require network access",
]
